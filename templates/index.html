{% extends "base.html" %}
{% block title %}Park254 — Slot Availability{% endblock %}
{% block content %}

<h1 style="font-size: 26px; margin-bottom: 4px;">Slot availability</h1>
<p style="color: var(--muted); margin-top: 0; margin-bottom: 28px;">
    {{ view.free }} free slots
</p>

<div class="panel">
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px;">
        {% for slot in view.slots %}
        <div style="
            padding: 16px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            background: {{ 'var(--green)' if slot.status == 'FREE' else 'var(--red)' }};
            color: var(--paper);
        ">
            <span class="slot-number" style="font-weight: 700; font-size: 14px;">Slot {{ slot.slot_id }}</span>
        </div>
        {% endfor %}
    </div>
</div>

<p style="margin-top: 20px; font-size: 14px; color: var(--muted);">
    <span style="display: inline-block; width: 10px; height: 10px; background: var(--green); border-radius: 2px; margin-right: 6px;"></span> Free
    &nbsp;&nbsp;
    <span style="display: inline-block; width: 10px; height: 10px; background: var(--red); border-radius: 2px; margin-right: 6px;"></span> Occupied
</p>

{% endblock %}
